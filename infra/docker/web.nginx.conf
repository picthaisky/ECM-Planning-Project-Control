# infra/docker/web.nginx.conf
#
# Served by infra/docker/web.Dockerfile. Listens on 8080 (unprivileged port, so the
# container can run as a non-root user).
#
# Cache policy is deliberate, not defaults (PWA delivery rule in CLAUDE.md): hashed,
# content-addressed assets are immutable forever; index.html and any service worker file
# must NEVER be cached - a stale service worker is a production incident.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    # Security headers (P0-SEC-01): clickjacking matters here specifically because Sprint
    # 9/10 land one-click VO/Payment Certificate approval actions. nginx does NOT merge
    # server-level add_header directives into a location block that sets its own add_header
    # (it's an all-or-nothing override per level), so every location below repeats the full
    # set rather than relying on inheritance from this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback: unknown paths resolve to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite emits content-hashed filenames under /assets/ - safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html itself: always revalidate, never cache, so a new deploy is picked up
    # immediately instead of being served from a stale disk/browser cache.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Service worker (once the PWA lands, ADR-0005): must be revalidated on every load,
    # or clients can get stuck on a stale worker indefinitely.
    location ~* (service-worker|sw)\.js$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
